<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mantrana AI</title>
    <meta name="description" content="Multimodal AI workspace for chat, document and media understanding, link reading, voice input, and image, video, and music generation." />
    <meta property="og:title" content="Mantrana AI" />
    <meta property="og:description" content="Multimodal AI workspace for chat, document and media understanding, link reading, voice input, and image, video, and music generation." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function ShimViteWebSocket(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var urlStr = String(url || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf('24678') !== -1
            ) {
              var target = new EventTarget();
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.readyState = 1;
              target.url = urlStr;
              target.protocol = protoStr || 'vite-hmr';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.binaryType = 'blob';
              target.send = function () {};
              target.close = function () {
                target.readyState = 3;
              };
              setTimeout(function () {
                try {
                  var evt = new Event('open');
                  if (typeof target.onopen === 'function') target.onopen(evt);
                  target.dispatchEvent(evt);
                } catch (_e) {}
              }, 0);
              return target;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          }
          ShimViteWebSocket.prototype = NativeWebSocket.prototype;
          ShimViteWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ShimViteWebSocket.OPEN = NativeWebSocket.OPEN;
          ShimViteWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ShimViteWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ShimViteWebSocket;
        }
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg = event && event.reason && (event.reason.message || String(event.reason));
            if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-teal-500/20 selection:text-teal-600 dark:selection:text-teal-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
